<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141826"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a58bff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2a2f3a" stroke-width="2"/>

  <!-- ambient glow -->
  <circle cx="230" cy="220" r="180" fill="url(#glow)"/>

  <!-- diamond gem soft outer glow -->
  <g filter="url(#soft)" opacity="0.55">
    <path d="M230 96 L330 196 L230 356 L130 196 Z" fill="url(#gem)"/>
  </g>
  <path d="M230 96 L330 196 L230 356 L130 196 Z" fill="url(#gem)"/>
  <!-- facets -->
  <path d="M230 96 L280 196 L230 356 L180 196 Z" fill="#ffffff" opacity="0.10"/>
  <path d="M230 96 L180 196 L130 196 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M230 96 L330 196 L280 196 Z" fill="#000000" opacity="0.10"/>
  <line x1="130" y1="196" x2="330" y2="196" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- AI sparkles -->
  <g fill="#e9e4ff">
    <path d="M356 120 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 z"/>
    <path d="M392 190 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" opacity="0.85"/>
  </g>

  <!-- search ring -->
  <g stroke="#5b8cff" stroke-width="16" fill="none" stroke-linecap="round">
    <circle cx="326" cy="330" r="52" fill="#0a0b10" fill-opacity="0.65"/>
    <line x1="366" y1="370" x2="410" y2="414"/>
  </g>
  <circle cx="326" cy="330" r="52" fill="none" stroke="#a58bff" stroke-width="4" opacity="0.6"/>
</svg>
